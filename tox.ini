[tox]
envlist = deptry, mypy

[testenv]
basepython = python3.10
set_env =
    VIRTUALENV_PIP = 24.0
    VIRTUALENV_SETUPTOOLS = 68.2.2
    VIRTUALENV_WHEEL = 0.42.0
deps =
    pip<24.1
    setuptools<70

[testenv:mypy]
description = 'Execute static analysis with mypy.'
commands =
  mypy radar/ tests/ scripts/ setup.py
deps =
    mypy
    types-WTForms
    types-jsonschema
    types-python-dateutil
    types-pytz
    types-setuptools
    types-zxcvbn

[testenv:deptry]
description = Run deptry to check for unused and missing dependencies
deps =
    deptry
commands =
    # Never fail GitActions
    python -c "import subprocess; subprocess.call(['deptry', '.'])"
