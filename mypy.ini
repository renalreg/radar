[mypy]
python_version = 3.11

[mypy-sqlalchemy.*,flask_sqlalchemy.*,flask_admin.*,cornflake.*,js2py.*,celery.*,xlsxwriter.*,tqdm.*]
ignore_missing_imports = True

# db.Model bases and hybrid_property setters/expressions; var-annotated because
# SQLAlchemy 2.0's typing can't infer Column(<custom type>) without Mapped[] hints
[mypy-radar.models.*]
disable_error_code = name-defined, no-redef, var-annotated

# serializer_class / model_class / sort_fields overrides on generic views
[mypy-radar.api.views.*]
disable_error_code = assignment
