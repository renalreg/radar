{% extends 'admin/base.html' %}

{% block access_control %}
  {% if current_user.is_authenticated() %}
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown">
        <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">{{ current_user.username }}</a>
        <div class="dropdown-menu dropdown-menu-right">
          <a class="dropdown-item" href="/">Back to RADAR</a>
          <a class="dropdown-item" href="{{ url_for('admin.logout') }}">Logout</a>
        </div>
      </li>
    </ul>
  {% endif %}
{% endblock %}
