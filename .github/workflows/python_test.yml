# 📘 Full documentation:
# https://github.com/renalreg/.github/blob/main/README.md#python-test-workflow
name: Python Test
on:
  pull_request:
    branches:
      - "master"
  workflow_dispatch:
jobs:
  call-workflow:
    name: Python Test workflow
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    uses: renalreg/.github/.github/workflows/python_test.yml@main
    secrets: inherit
    with:
      python_versions: '["3.9"]'
      os: '["ubuntu-latest"]'
      package_manager_command: ""
      install_command: "pip install 'pip<24.1' && pip install 'setuptools<58' wheel && pip install --no-build-isolation -r requirements.txt -r dev-requirements.txt && pip install --upgrade tox virtualenv"
      test_command: "VIRTUALENV_PIP=24.0 VIRTUALENV_SETUPTOOLS=57.5.0 VIRTUALENV_WHEEL=0.38.4 PIP_NO_BUILD_ISOLATION=1 tox"
